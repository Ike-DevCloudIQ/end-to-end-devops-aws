name: cd-demo-app-gitops

on:
  push:
    branches:
      - main
    paths:
      - ultimate-devops-project-demo/demo-app-image/**
      - .github/workflows/cd-demo-app-gitops.yaml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-push-update-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Define image tag
        id: vars
        run: echo "IMAGE_TAG=run-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ultimate-devops-project-demo/demo-app-image
          file: ultimate-devops-project-demo/demo-app-image/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/demo-app:${{ steps.vars.outputs.IMAGE_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/demo-app:latest

      - name: Update Kubernetes manifest image tag
        run: |
          sed -i "0,/image: .*/s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/demo-app:${{ steps.vars.outputs.IMAGE_TAG }}|" ultimate-devops-project-demo/kubernetes/demo-app/deployment.yaml

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git add ultimate-devops-project-demo/kubernetes/demo-app/deployment.yaml
          git commit -m "ci: update demo-app image to ${{ steps.vars.outputs.IMAGE_TAG }}"
          git push
